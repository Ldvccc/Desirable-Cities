# Changes from v3 to v4, with the evidence from the pilot articles.
# Counts are matches of method A-form with list v3 (removed, re-encoded) or
# occurrences in the text (added): Lyon / Courchaton.
changes:
  removed:
    - {fr: action, code: A, src: G, evidence: "Lyon 11 / Courchaton 0", reason: "Financial shares, 'action municipale', 'action sociale': never people acting in a place (rule D4). Rule I2 would need an exception."}
    - {fr: projet, code: R, src: P, evidence: "Lyon 32 / Courchaton 0", reason: "Urban or institutional projects; never reports what people think of the place (rule D6)."}
    - {fr: proposition, code: R, src: P, evidence: "Lyon 13 / Courchaton 0", reason: "'proposer' means 'to offer' (radios proposant du jazz, visites proposées); never a reflection."}
  added:
    - {fr: fleuve, code: N, evidence: "Lyon 10", reason: "Synonym of rivière (not coded under rule I1); the main water feature of river towns."}
    - {fr: rive, code: N, evidence: "Lyon 18", reason: "River banks (rive gauche, rive droite)."}
    - {fr: berge, code: N, evidence: "Lyon 10", reason: "River banks, often described as leisure places."}
    - {fr: confluent, code: N, evidence: "Lyon 8", reason: "Meeting of rivers; generic in geography sections."}
    - {fr: pente, code: N, evidence: "Lyon 9", reason: "Relief (slopes of a hill)."}
    - {fr: sommet, code: N, evidence: "Lyon 7", reason: "Relief (top of a hill or mountain); 'sommet du G7' excluded."}
    - {fr: précipitations, code: N, evidence: "Lyon 2 / Courchaton 3", reason: "Weather; part of the standard climate paragraph of thousands of commune articles, next to température."}
    - {fr: étang, code: N, evidence: "Lyon 2", reason: "Water feature, synonym of lac."}
    - {fr: espace vert, code: N, evidence: "Lyon 4", reason: "Vegetated open space; Koinos green features."}
    - {fr: terre arable, code: N, evidence: "Courchaton 1", reason: "Farmland; standard land-cover paragraph (Corine Land Cover) next to prairies and forêts."}
    - {fr: fête, code: C, evidence: "Lyon 17", reason: "Festivity (fête des Lumières, fête patronale); only fête foraine and salle des fêtes were in v3."}
    - {fr: spectacle, code: C, evidence: "Lyon 7", reason: "Cultural events."}
    - {fr: concert, code: C, evidence: "Lyon 4 / Courchaton 1", reason: "Cultural events; more specific than musique, so not coded in v3 (rule I1)."}
    - {fr: cuisine, code: C, evidence: "Lyon 6", reason: "Gastronomy (cuisine lyonnaise); forms: culinaire."}
    - {fr: danse, code: C, evidence: "Lyon 13", reason: "Dance as an art form (Maison de la danse, Biennale de la danse), like musique; v3 coded it A as a form of danser, against rule D4."}
    - {fr: héritage, code: C, evidence: "Lyon 4", reason: "Synonym of patrimoine."}
    - {fr: médiéval, code: C, evidence: "Lyon 5", reason: "History (period)."}
    - {fr: antique, code: C, evidence: "Lyon 5", reason: "History (period); forms: Antiquité."}
    - {fr: romain, code: C, evidence: "Lyon 22", reason: "History (Roman period); also matches gallo-romain."}
    - {fr: fréquentation, code: C, evidence: "Lyon 3", reason: "Crowd density (Koinos many people); forms: fréquenté."}
    - {fr: quai, code: B, evidence: "Lyon 13", reason: "Open-air public space along rivers (Koinos promenade)."}
    - {fr: boulevard, code: B, evidence: "Lyon 6", reason: "Major street (Koinos avenue, ch. 15 major boulevards)."}
