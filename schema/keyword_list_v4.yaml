# Desirable Cities: keyword list v4 (PROPOSAL, not yet validated)
#
# Derived from keyword list v3 (schema/keyword_list_v3.yaml, the list the
# human coders used) with what the two pilot articles showed:
#   Courchaton, fr.wikipedia rev. 234797520 (small article, human reference)
#   Lyon,       fr.wikipedia rev. 241583218 (33,000 words, no reference yet)
# Prepared by Claude (claude-opus-5-5) on 24 November 2026, at the request of
# the authors; every change is listed in `changes` at the end of this file
# with its reason and the evidence. To be validated by the coders and by the
# author of the framework (J. Villar) before any use as a reference.
#
# Criteria
#   kept     all Koinos tags (K), category names (G) and Card elements (T),
#            for compatibility with the framework, except one G entry whose
#            matches were all false (action).
#   removed  an extension (E) or reflection marker (P) whose matches in the
#            pilot articles are almost never the intended sense.
#   added    (src L) a generic word that names an element of the framework,
#            occurs in the pilot articles, is not covered by v3 (synonym or
#            more specific word, rule I1) and is expected in many commune
#            articles. Nothing specific to Lyon (soie, canut, traboule) is added.
#   encoding new exclusions (rule I4) and corrected forms for the homonyms
#            seen in the pilot articles.
# Lyon was used to build this list: it is development data for v4, not a
# test. A third article, coded by the humans, is needed to test v4.
#
# Two layers, kept apart on purpose:
#
# 1. The LIST itself: `tag`, `fr`, `src`, and the code of the section the
#    entry is in (383 entries, duplicates included).
#
# 2. The ENCODING of the rules for the algorithm (keyword_coder.py, method
#    A-form). It does not change the list; it spells out what the rules mean
#    for each entry:
#      pos      n (noun, default) | adj | v (verb) | expr (multi-word) |
#               inv (invariable) | value (°C values, rule I6)
#      lemma    singular form when the list gives a plural ("vagues")
#      plural   irregular plural ("hôpitaux")
#      forms    words built on the same French stem (rule I1), inflected
#               automatically (plural, feminine). PROPOSED by the algorithm
#               authors, to be checked by the coders.
#      conj     extra or irregular conjugated forms of a verb
#      verb     a verb whose conjugated forms count (rule I1: "critiqué")
#      drop     generated forms that are another word ("marché" is not
#               "marcher": it is the B entry "marché")
#      exclude  fixed expressions and homonyms (rule I4). Regular
#               expressions on the sentence, case-insensitive; a space
#               matches any run of spaces and ' matches ' and ’.
#      require  det       the lemma counts only after a determiner ("le son",
#                         not the possessive "son")
#               reflexive the verb counts only with a reflexive pronoun
#                         ("se reposer", not "repose sur le bassin")
#               ete       "été" is the season, not the participle of "être"
#      when     rule D1: the code holds only in that context (sound, smell,
#               feeling); `else` gives the code otherwise
#      code     code to use instead of the section code (rule D2)
#      case     exact: match the case of `fr` (acronyms)

version: 4.0.0
date: "2026-11-24"
status: proposal
title: "Desirable Cities: keyword list v4 (proposal)"
derived_from: schema/keyword_list_v3.yaml
rules: docs/rules_manual_coding_v2.md
encoding:
  # Encyclopedic text uses the third person: only infinitive, third-person
  # forms and participles of -er verbs are generated ("joues" is a cheek,
  # "pensions" a pension, not forms of jouer and penser).
  third_person_only: true
sources:
  G: "name of a category or subcategory (rule I2)"
  K: "Koinos tag (thesis §31.2.3.7, pp. 534-537)"
  T: "Emotion-naire Cards (thesis p. 367)"
  E: "extension"
  P: "reflection marker (the thesis gives no list for reflections)"
  L: "added in v4 from the pilot articles (Courchaton, Lyon)"
codes:
  N: natural
  C: cultural
  B: constructural
  E: emotion
  A: action
  R: reflection

categories:

  N:
    label: Natural environment
    groups:
      - name: Category and subcategory names (rule I2)
        entries:
          - {tag: natural, fr: naturel, src: G, pos: adj, forms: [nature]}
          - {tag: season, fr: saison, src: G, forms: [saisonnier]}
          - {tag: weather, fr: météo, src: G, forms: [météorologique, météorologie, météorologue, météorologiste]}
          - {tag: time of day, fr: moment de la journée, src: G, pos: expr}
          - {tag: temperature, fr: température, src: G}
          - {tag: water features, fr: eau, src: G}
          - {tag: green features, fr: végétation, src: G, forms: [végétal, végétalisé, végétalisation]}
      - name: Season (Koinos 1.1)
        entries:
          - {tag: winter, fr: hiver, src: K, forms: [hivernal]}
          - {tag: spring, fr: printemps, src: K, pos: inv, forms: [printanier]}
          - {tag: summer, fr: été, src: K, require: ete}
          - {tag: autumn, fr: automne, src: K, forms: [automnal]}
          - {tag: raining, fr: saison des pluies, src: K, pos: expr}
          - {tag: dry, fr: sécheresse, src: K, forms: [sec, sèche, sécher, séché, asséché, assèchement]}
      - name: Weather (Koinos 1.2)
        entries:
          - {tag: sunny, fr: ensoleillé, src: K, pos: adj, forms: [ensoleillement, soleil]}
          - {tag: cloudy, fr: nuageux, src: K, pos: adj, forms: [nuage]}
          - {tag: windy, fr: venteux, src: K, pos: adj}
          - {tag: rainy, fr: pluvieux, src: K, pos: adj, forms: [pluie, pluvial, pluviométrie, pluviométrique, pluviosité]}
          - {tag: stormy, fr: orageux, src: K, pos: adj, forms: [orage]}
          - {tag: rainbow, fr: arc-en-ciel, src: K, pos: expr}
          - {tag: snow, fr: neige, src: K, forms: [neigeux, enneigé, enneigement, neiger]}
          - {tag: mist, fr: brume, src: K, forms: [brumeux]}
          - {tag: fog, fr: brouillard, src: K}
          - {tag: moon, fr: lune, src: K, forms: [lunaire]}
          - {tag: stars-full, fr: étoilé, src: K, pos: adj, forms: [étoile],
             exclude: ['\w+-étoiles?', 'tables? étoilées?', 'restaurants? étoilés?', 'chefs? étoilés?',
                       'étoiles? (?:au |du )?(?:guide )?Michelin', 'étoiles? d''(?:or|argent)']}
      - name: Time of day (Koinos 1.3)
        entries:
          - {tag: early morning, fr: aube, src: K, exclude: ['aube du (?:\w+ )?(?:siècle|millénaire)']}
          - {tag: morning, fr: matin, src: K, forms: [matinée, matinal]}
          - {tag: late morning, fr: fin de matinée, src: K, pos: expr}
          - {tag: noon, fr: midi, src: K}
          - {tag: early afternoon, fr: début d’après-midi, src: K, pos: expr}
          - {tag: afternoon, fr: après-midi, src: K, pos: expr}
          - {tag: late afternoon, fr: fin d’après-midi, src: K, pos: expr}
          - {tag: evening, fr: soir, src: K, forms: [soirée]}
          - {tag: late evening, fr: nuit, src: K, forms: [nuitée]}
          - {tag: dawn, fr: aurore, src: K}
      - name: Temperature (Koinos 1.4)
        entries:
          - {tag: "temperature (−10 to 45 °C)", fr: "any value in °C (rule I6)", src: K, pos: value}
      - name: Natural sounds (Koinos 1.5)
        entries:
          - {tag: sea waves, fr: vagues, src: K, lemma: vague}
          - {tag: river, fr: rivière, src: K}
          - {tag: falls, fr: cascade, src: K}
          - {tag: birds, fr: oiseaux, src: K, lemma: oiseau, exclude: ['vol d''oiseau']}
          - {tag: dogs, fr: chiens, src: K, lemma: chien, forms: [chienne]}
          - {tag: cats, fr: chats, src: K, lemma: chat}
          - {tag: wind, fr: vent, src: K}
          - {tag: breeze, fr: brise, src: K, exclude: ['brise-lames', 'brise-glace', 'brise-vent']}
      - name: Water features (Koinos 1.6)
        entries:
          - {tag: sea, fr: mer, src: K}
          - {tag: river, fr: rivière, src: K}
          - {tag: fall, fr: cascade, src: K}
          - {tag: lake, fr: lac, src: K}
      - name: Green features (Koinos 1.7)
        entries:
          - {tag: volcano, fr: volcan, src: K, forms: [volcanique, volcanisme]}
          - {tag: mountain, fr: montagne, src: K, forms: [montagneux, montagnard]}
          - {tag: hill, fr: colline, src: K}
          - {tag: forest, fr: forêt, src: K, forms: [forestier, déforestation, reforestation]}
          - {tag: trees, fr: arbres, src: K, lemma: arbre}
          - {tag: bushes, fr: buissons, src: K, lemma: buisson}
          - {tag: grass, fr: herbe, src: K, forms: [herbacé, herbage, herbeux]}
          - {tag: flowers, fr: fleurs, src: K, lemma: fleur, forms: [fleuri, fleurir, fleurissement, fleuriste],
             exclude: ['à fleur de', 'fleurs? de lys']}
          - {tag: blossoming, fr: floraison, src: K}
          - {tag: island, fr: île, src: K, forms: [îlot, presqu'île]}
      - name: Extension
        entries:
          - {tag: landscape, fr: paysage, src: E, forms: [paysager, paysagiste]}
          - {tag: climate, fr: climat, src: E, forms: [climatique, climatologie, climatologique, climatisation, climatisé]}
          - {tag: heat, fr: chaleur, src: E}
          - {tag: cold, fr: froid, src: E, pos: adj, forms: [froidure, refroidissement]}
          - {tag: dusk, fr: crépuscule, src: E, forms: [crépusculaire]}
          - {tag: relief, fr: relief, src: E}
          - {tag: valley, fr: vallée, src: E, forms: [vallon, vallonné, vallonnement]}
          - {tag: plain, fr: plaine, src: E}
          - {tag: plateau, fr: plateau, src: E}
          - {tag: cliff, fr: falaise, src: E}
          - {tag: gorge, fr: gorge, src: E}
          - {tag: rock, fr: rocher, src: E, forms: [roche, rocheux]}
          - {tag: cave, fr: grotte, src: E}
          - {tag: geology, fr: géologie, src: E, forms: [géologique, géologue]}
          - {tag: coast, fr: côte, src: E, forms: [côtier], exclude: ['côte à côte']}
          - {tag: beach, fr: plage, src: E}
          - {tag: marsh, fr: marais, src: E, pos: inv}
          - {tag: spring (water), fr: source, src: E, exclude: ['selon (?:les |des |certaines |d''autres )?sources', 'de source sûre', 'sources? (?:historiques?|écrites?|anciennes?|documentaires?|bibliographiques?)',
                                                               '\(\s*sources?', 'sources? :', 'sources? (?:et|ou) (?:les )?(?:études|documents|archives|textes)']}
          - {tag: meadow, fr: prairie, src: E}
          - {tag: field, fr: champ, src: E, forms: [champêtre], exclude: ['champ d''action', 'champ d''application', 'champs? de vision', 'champs? électromagnétiques?']}
          - {tag: orchard, fr: verger, src: E}
          - {tag: vineyard, fr: vignoble, src: E, forms: [vigne, vigneron]}
          - {tag: fauna, fr: faune, src: E, forms: [faunistique]}
          - {tag: flora, fr: flore, src: E, forms: [floristique]}
          - {tag: biodiversity, fr: biodiversité, src: E}
          - {tag: nature reserve, fr: réserve naturelle, src: E, pos: expr}
      - name: Added in v4 (pilot articles Courchaton and Lyon)
        entries:
          - {tag: river (large), fr: fleuve, src: L}
          - {tag: riverbank, fr: rive, src: L, forms: [riverain]}
          - {tag: bank, fr: berge, src: L}
          - {tag: confluence, fr: confluent, src: L, forms: [confluence]}
          - {tag: slope, fr: pente, src: L}
          - {tag: summit, fr: sommet, src: L, exclude: ['sommets? du G ?\d+']}
          - {tag: precipitation, fr: précipitations, src: L, lemma: précipitation}
          - {tag: pond, fr: étang, src: L}
          - {tag: green space, fr: espace vert, src: L, pos: expr}
          - {tag: arable land, fr: terre arable, src: L, pos: expr}

  C:
    label: Cultural environment
    groups:
      - name: Category and subcategory names (rule I2)
        entries:
          - {tag: cultural, fr: culturel, src: G, pos: adj, forms: [culture, culturellement],
             exclude: ['cultures? (?:permanentes?|annuelles?|céréalières?|maraîchères?|intensives?|fourragères?|vivrières?|industrielles?|arables?)',
                       'cultures? (?:de |du |des |de la |de l'')(?:vigne|blé|maïs|céréales|tabac|houblon|lin|chanvre|betteraves?|oliviers?|légumes|fruits|pommes de terre)',
                       '(?:grandes|petites) cultures', 'terres? de cultures?', 'mises? en culture', 'en culture']}
          - {tag: social crowd, fr: foule, src: G}
          - {tag: atmosphere, fr: ambiance, src: G}
          - {tag: sound, fr: son, src: G, require: det, forms: [sonore, sonorité]}
          - {tag: smell, fr: odeur, src: G}
      - name: Social crowd density (Koinos 2.1)
        entries:
          - {tag: nobody, fr: désert, src: K, pos: adj, forms: [déserté, désertique, désertification]}
          - {tag: few people, fr: peu fréquenté, src: K, pos: expr}
          - {tag: people, fr: passants, src: K, lemma: passant, require: det}
          - {tag: many people, fr: affluence, src: K}
          - {tag: crowded, fr: foule, src: K}
      - name: Atmosphere (Koinos 2.2)
        entries:
          - {tag: relax, fr: détente, src: K}
          - {tag: peaceful, fr: paisible, src: K, forms: [paisiblement]}
          - {tag: mistic (mystic), fr: mystique, src: K, forms: [mysticisme]}
          - {tag: sacred, fr: sacré, src: K, pos: adj}
          - {tag: cultural, fr: culturel, src: K, pos: adj}
          - {tag: educational, fr: éducatif, src: K, pos: adj, forms: [éducation]}
          - {tag: artistic, fr: artistique, src: K, forms: [artiste, art],
             exclude: ['ouvrages? d''art', '(?:gymnastique|patinage|natation|nage) artistiques?']}
          - {tag: festive, fr: festif, src: K, pos: adj, forms: [festivité]}
          - {tag: sportive, fr: sportif, src: K, pos: adj, forms: [sport]}
          - {tag: urban, fr: urbain, src: K, pos: adj, forms: [urbanisé, urbanisme, périurbain, urbanité]}
          - {tag: safe, fr: sûr, src: K, pos: adj, forms: [sûreté], exclude: ['bien sûr', 'à coup sûr', 'sûr(?:e|s|es)? de']}
          - {tag: clean, fr: propre, src: K, pos: adj, forms: [propreté],
             exclude: ['fiscalité propre', 'noms? propres?', 'sens propre', 'fonds propres', 'en propre', 'propres? à',
                       'amour-propre', '(?:son|sa|ses|leur|leurs|notre|nos|mon|ma|mes|votre|vos) propres?',
                       '(?:industries|compétences|ressources|moyens|biens|recettes|services|structures|équipements|activités|pouvoirs) propres']}
      - name: Sounds (Koinos 2.3)
        entries:
          - {tag: quiet, fr: calme, src: K, forms: [calmement]}
          - {tag: people, fr: brouhaha, src: K}
          - {tag: cars, fr: voitures, src: K, lemma: voiture, when: {context: sound, else: B}}
          - {tag: trains, fr: trains, src: K, lemma: train, when: {context: sound, else: B},
             exclude: ['en train de', 'trains? de vie', 'trains? de (?:mesures|réformes)']}
          - {tag: planes, fr: avions, src: K, lemma: avion}
          - {tag: bicycles, fr: vélos, src: K, lemma: vélo, when: {context: sound, else: B}}
          - {tag: music, fr: musique, src: K, forms: [musical, musicien]}
          - {tag: busy, fr: bruyant, src: K, pos: adj, forms: [bruit]}
      - name: Smells (Koinos 2.4)
        entries:
          - {tag: restaurants, fr: restaurants, src: K, lemma: restaurant, when: {context: smell, else: B}}
          - {tag: bakeries, fr: boulangeries, src: K, lemma: boulangerie, forms: [boulanger]}
          - {tag: bars, fr: bars, src: K, lemma: bar, when: {context: smell, else: B}, exclude: ['\d+(?:,\d+)? bars?']}
          - {tag: food markets, fr: marchés, src: K, lemma: marché, when: {context: smell, else: B},
             exclude: ['marchés? du travail', 'marchés? de l''emploi', 'marchés? immobiliers?', 'bon marché',
                       'parts? de marché', 'marchés? financiers?', 'marché commun', 'marchés? publics?']}
      - name: Extension
        entries:
          - {tag: history, fr: histoire, src: E, forms: [historique, historien, historiquement, préhistoire, préhistorique, historiographie]}
          - {tag: heritage, fr: patrimoine, src: E, forms: [patrimonial]}
          - {tag: archaeology, fr: archéologie, src: E, forms: [archéologique, archéologue]}
          - {tag: remains, fr: vestiges, src: E, lemma: vestige}
          - {tag: memory, fr: mémoire, src: E, forms: [mémoriel]}
          - {tag: legend, fr: légende, src: E, forms: [légendaire]}
          - {tag: tradition, fr: tradition, src: E, forms: [traditionnel, traditionnellement]}
          - {tag: festival, fr: festival, src: E, forms: [festivalier]}
          - {tag: fair, fr: foire, src: E}
          - {tag: carnival, fr: carnaval, src: E, forms: [carnavalesque]}
          - {tag: religion, fr: religion, src: E, forms: [religieux, religieusement]}
          - {tag: pilgrimage, fr: pèlerinage, src: E, forms: [pèlerin]}
          - {tag: gastronomy, fr: gastronomie, src: E, forms: [gastronomique]}
          - {tag: local speciality, fr: spécialité, src: E}
          - {tag: wine, fr: vin, src: E}
          - {tag: cheese, fr: fromage, src: E, forms: [fromager, fromagerie]}
          - {tag: terroir, fr: terroir, src: E}
          - {tag: identity, fr: identité, src: E, forms: [identitaire]}
          - {tag: coat of arms, fr: blason, src: E, forms: [blasonnement]}
          - {tag: twinning, fr: jumelage, src: E, forms: [jumelé]}
          - {tag: regional language, fr: patois, src: E, pos: inv}
          - {tag: association, fr: association, src: E, forms: [associatif]}
          - {tag: community, fr: communauté, src: E, forms: [communautaire]}
          - {tag: tourism, fr: tourisme, src: E, forms: [touristique, touriste]}
          - {tag: craftsmanship, fr: artisanat, src: E, forms: [artisan, artisanal]}
          - {tag: agriculture, fr: agriculture, src: E, forms: [agricole, agriculteur, agricultrice]}
          - {tag: industry, fr: industrie, src: E, forms: [industriel, industrialisation, industrialisé]}
      - name: Added in v4 (pilot articles Courchaton and Lyon)
        entries:
          - {tag: festivity, fr: fête, src: L}
          - {tag: show, fr: spectacle, src: L}
          - {tag: concert, fr: concert, src: L}
          - {tag: cuisine, fr: cuisine, src: L, forms: [culinaire]}
          - {tag: dance (art form), fr: danse, src: L}
          - {tag: heritage (legacy), fr: héritage, src: L}
          - {tag: medieval, fr: médiéval, src: L, pos: adj}
          - {tag: ancient, fr: antique, src: L, forms: [antiquité]}
          - {tag: Roman, fr: romain, src: L, pos: adj, exclude: ['chiffres? romains?']}
          - {tag: visitor numbers, fr: fréquentation, src: L, forms: [fréquenté]}

  B:
    label: Constructural environment
    groups:
      - name: Category and subcategory names (rule I2)
        entries:
          - {tag: constructural, fr: constructurel, src: G, pos: adj,
             forms: [construction, construire, construit, construisit, construisirent, construisent, construisait,
                     reconstruction, reconstruire, reconstruit, constructeur],
             exclude: ['permis de construire']}
          - {tag: open-air public space, fr: espace public, src: G, pos: expr}
          - {tag: visual reference, fr: repère visuel, src: G, pos: expr}
          - {tag: transportation, fr: transport, src: G}
          - {tag: infrastructure, fr: infrastructure, src: G}
      - name: Open-air public spaces (Koinos 3.1)
        entries:
          - {tag: square/plaza, fr: place, src: K,
             exclude: ['(?:prendre|prend|prennent|prenait|prenaient|pris|prise|prirent) place', 'en place', 'sur place',
                       '(?:se|s'') plac\w*', 'plac\w* en (?:tête|\w+ position)',
                       '(?:nous|vous|qui|ce qui) placen?t?', 'placen?t? (?:la|le|les|l'') (?:ville|commune|cité|métropole)',
                       'places? de choix', 'places? assises?', '\d[\d  ]* places',
                       'à (?:la|sa|leur) place', 'laiss\w* (?:la )?place', 'fai\w* place', 'fit place',
                       'c[èé]d\w* (?:la )?place', 'en lieu et place', '(?:\d+e|\d+ᵉ|première|deuxième|troisième|dernière) place']}
          - {tag: park, fr: parc, src: K}
          - {tag: garden, fr: jardin, src: K, forms: [jardinier]}
          - {tag: promenade, fr: promenade, src: K}
          - {tag: marina, fr: port de plaisance, src: K, pos: expr}
          - {tag: avenue, fr: avenue, src: K}
          - {tag: street, fr: rue, src: K}
          - {tag: lane, fr: ruelle, src: K}
          - {tag: pedestrian bridge, fr: passerelle, src: K}
          - {tag: pedestrian boulevard, fr: rue piétonne, src: K, pos: expr}
          - {tag: terrace, fr: terrasse, src: K}
          - {tag: mountain, fr: montagne, src: K, code: N, forms: [montagneux, montagnard]}
          - {tag: pond, fr: bassin, src: K,
             exclude: ['bassins? (?:houillers?|miniers?|versants?|hydrographiques?|sédimentaires?|potassiques?|ferrifères?|parisien|aquitain|méditerranéen)',
                       'bassins? (?:de vie|d''emplois?|d''habitat|de population|d''alimentation|de risques?)',
                       'bassins? (?:de la |du |de l''|des )(?-i:[A-ZÀ-Ý])']}
          - {tag: swimming pool, fr: piscine, src: K}
          - {tag: sport features, fr: stade, src: K, exclude: ['à ce stade', 'au stade de', '(?:premier|dernier) stade']}
          - {tag: entertainment-fair, fr: fête foraine, src: K, pos: expr}
          - {tag: amusement park, fr: parc d’attractions, src: K, pos: expr}
          - {tag: street market, fr: marché, src: K, forms: [marchand],
             exclude: ['marchés? du travail', 'marchés? de l''emploi', 'marchés? immobiliers?', 'bon marché',
                       'parts? de marché', 'marchés? financiers?', 'marché commun', 'marchés? publics?']}
      - name: Visual references (Koinos 3.2)
        entries:
          - {tag: landmark, fr: monument, src: K, forms: [monumental]}
          - {tag: skyline, fr: silhouette, src: K}
          - {tag: intersection, fr: carrefour, src: K}
      - name: Transportation systems (Koinos 3.3)
        entries:
          - {tag: metro/subway, fr: métro, src: K}
          - {tag: elevated metro, fr: métro aérien, src: K, pos: expr}
          - {tag: bus, fr: bus, src: K, pos: inv, forms: [autobus]}
          - {tag: tourist bus, fr: bus touristique, src: K, pos: expr}
          - {tag: monorail, fr: monorail, src: K}
          - {tag: cable car, fr: téléphérique, src: K}
          - {tag: funicular, fr: funiculaire, src: K}
