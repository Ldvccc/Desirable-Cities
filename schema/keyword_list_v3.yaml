          - {tag: heritage, fr: patrimoine, src: E, forms: [patrimonial]}
          - {tag: archaeology, fr: archéologie, src: E, forms: [archéologique, archéologue]}
          - {tag: remains, fr: vestiges, src: E, lemma: vestige}
          - {tag: memory, fr: mémoire, src: E, forms: [mémoriel]}
          - {tag: legend, fr: légende, src: E, forms: [légendaire]}
          - {tag: tradition, fr: tradition, src: E, forms: [traditionnel, traditionnellement]}
          - {tag: festival, fr: festival, src: E}
          - {tag: fair, fr: foire, src: E}
          - {tag: carnival, fr: carnaval, src: E, forms: [carnavalesque]}
          - {tag: religion, fr: religion, src: E, forms: [religieux, religieusement]}
          - {tag: pilgrimage, fr: pèlerinage, src: E, forms: [pèlerin]}
          - {tag: gastronomy, fr: gastronomie, src: E, forms: [gastronomique]}
          - {tag: local speciality, fr: spécialité, src: E}
          - {tag: wine, fr: vin, src: E}
          - {tag: cheese, fr: fromage, src: E, forms: [fromager, fromagerie]}
          - {tag: terroir, fr: terroir, src: E}
          - {tag: identity, fr: identité, src: E, forms: [identitaire]}
          - {tag: coat of arms, fr: blason, src: E, forms: [blasonnement]}
          - {tag: twinning, fr: jumelage, src: E, forms: [jumelé]}
          - {tag: regional language, fr: patois, src: E, pos: inv}
          - {tag: association, fr: association, src: E, forms: [associatif]}
          - {tag: community, fr: communauté, src: E, forms: [communautaire]}
          - {tag: tourism, fr: tourisme, src: E, forms: [touristique, touriste]}
