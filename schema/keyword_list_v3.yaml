# Desirable Cities: keyword list v3 (machine-readable version)
#
# Source document: docs/keyword_list_v3.pdf (Ivann Vasic, Ludovic Blondeau,
# supervised by Fabien Pfaender and John Villar, 14 November 2026).
# Coding rules:    docs/rules_manual_coding_v2.md
#
# Two layers, kept apart on purpose:
#
# 1. The LIST itself: `tag`, `fr`, `src`, and the code of the section the
#    entry is in. This is exactly the PDF (341 entries, duplicates included).
#    Do not edit it without a new version of the list.
#
# 2. The ENCODING of the rules for the algorithm (keyword_coder.py, method
#    A-form). It does not change the list; it spells out what the rules mean
#    for each entry:
#      pos      n (noun, default) | adj | v (verb) | expr (multi-word) |
#               inv (invariable) | value (°C values, rule I6)
#      lemma    singular form when the list gives a plural ("vagues")
#      plural   irregular plural ("hôpitaux")
#      forms    words built on the same French stem (rule I1), inflected
#               automatically (plural, feminine). PROPOSED by the algorithm
#               authors, to be checked by the coders.
#      conj     extra or irregular conjugated forms of a verb
#      verb     a verb whose conjugated forms count (rule I1: "critiqué")
#      drop     generated forms that are another word ("marché" is not
#               "marcher": it is the B entry "marché")
#      exclude  fixed expressions and homonyms (rule I4). Regular
#               expressions on the sentence, case-insensitive; a space
#               matches any run of spaces and ' matches ' and ’.
#      require  det       the lemma counts only after a determiner ("le son",
#                         not the possessive "son")
#               reflexive the verb counts only with a reflexive pronoun
#                         ("se reposer", not "repose sur le bassin")
#               ete       "été" is the season, not the participle of "être"
#      when     rule D1: the code holds only in that context (sound, smell,
#               feeling); `else` gives the code otherwise
#      code     code to use instead of the section code (rule D2)
#      case     exact: match the case of `fr` (acronyms)

version: 3.0.0
date: "2026-11-14"
title: "Desirable Cities: keyword list v3"
document: docs/keyword_list_v3.pdf
rules: docs/rules_manual_coding_v2.md
sources:
  G: "name of a category or subcategory (rule I2)"
  K: "Koinos tag (thesis §31.2.3.7, pp. 534-537)"
  T: "Emotion-naire Cards (thesis p. 367)"
  E: "extension"
  P: "reflection marker (the thesis gives no list for reflections)"
codes:
  N: natural
  C: cultural
  B: constructural
  E: emotion
  A: action
  R: reflection

categories:

  N:
    label: Natural environment
    groups:
      - name: Category and subcategory names (rule I2)
        entries:
          - {tag: natural, fr: naturel, src: G, pos: adj, forms: [nature, naturellement]}
          - {tag: season, fr: saison, src: G, forms: [saisonnier]}
          - {tag: weather, fr: météo, src: G, forms: [météorologique, météorologie, météorologue, météorologiste]}
          - {tag: time of day, fr: moment de la journée, src: G, pos: expr}
          - {tag: temperature, fr: température, src: G}
          - {tag: water features, fr: eau, src: G}
          - {tag: green features, fr: végétation, src: G, forms: [végétal, végétalisé, végétalisation]}
      - name: Season (Koinos 1.1)
        entries:
          - {tag: winter, fr: hiver, src: K, forms: [hivernal]}
          - {tag: spring, fr: printemps, src: K, pos: inv, forms: [printanier]}
          - {tag: summer, fr: été, src: K, require: ete}
          - {tag: autumn, fr: automne, src: K, forms: [automnal]}
          - {tag: raining, fr: saison des pluies, src: K, pos: expr}
          - {tag: dry, fr: sécheresse, src: K, forms: [sec, sèche, sécher, séché, asséché, assèchement]}
      - name: Weather (Koinos 1.2)
        entries:
          - {tag: sunny, fr: ensoleillé, src: K, pos: adj, forms: [ensoleillement, soleil]}
          - {tag: cloudy, fr: nuageux, src: K, pos: adj, forms: [nuage]}
          - {tag: windy, fr: venteux, src: K, pos: adj}
          - {tag: rainy, fr: pluvieux, src: K, pos: adj, forms: [pluie, pluvial, pluviométrie, pluviométrique, pluviosité]}
          - {tag: stormy, fr: orageux, src: K, pos: adj, forms: [orage]}
          - {tag: rainbow, fr: arc-en-ciel, src: K, pos: expr}
          - {tag: snow, fr: neige, src: K, forms: [neigeux, enneigé, enneigement, neiger]}
          - {tag: mist, fr: brume, src: K, forms: [brumeux]}
          - {tag: fog, fr: brouillard, src: K}
          - {tag: moon, fr: lune, src: K, forms: [lunaire]}
          - {tag: stars-full, fr: étoilé, src: K, pos: adj, forms: [étoile]}
      - name: Time of day (Koinos 1.3)
        entries:
          - {tag: early morning, fr: aube, src: K}
          - {tag: morning, fr: matin, src: K, forms: [matinée, matinal]}
          - {tag: late morning, fr: fin de matinée, src: K, pos: expr}
          - {tag: noon, fr: midi, src: K}
          - {tag: early afternoon, fr: début d’après-midi, src: K, pos: expr}
          - {tag: afternoon, fr: après-midi, src: K, pos: expr}
          - {tag: late afternoon, fr: fin d’après-midi, src: K, pos: expr}
          - {tag: evening, fr: soir, src: K, forms: [soirée]}
          - {tag: late evening, fr: nuit, src: K, forms: [nuitée]}
          - {tag: dawn, fr: aurore, src: K}
      - name: Temperature (Koinos 1.4)
        entries:
          - {tag: "temperature (−10 to 45 °C)", fr: "any value in °C (rule I6)", src: K, pos: value}
      - name: Natural sounds (Koinos 1.5)
        entries:
          - {tag: sea waves, fr: vagues, src: K, lemma: vague}
          - {tag: river, fr: rivière, src: K}
          - {tag: falls, fr: cascade, src: K}
          - {tag: birds, fr: oiseaux, src: K, lemma: oiseau, exclude: ['vol d''oiseau']}
          - {tag: dogs, fr: chiens, src: K, lemma: chien, forms: [chienne]}
          - {tag: cats, fr: chats, src: K, lemma: chat}
          - {tag: wind, fr: vent, src: K}
          - {tag: breeze, fr: brise, src: K, exclude: ['brise-lames', 'brise-glace', 'brise-vent']}
      - name: Water features (Koinos 1.6)
        entries:
          - {tag: sea, fr: mer, src: K}
          - {tag: river, fr: rivière, src: K}
          - {tag: fall, fr: cascade, src: K}
          - {tag: lake, fr: lac, src: K}
      - name: Green features (Koinos 1.7)
        entries:
          - {tag: volcano, fr: volcan, src: K, forms: [volcanique, volcanisme]}
          - {tag: mountain, fr: montagne, src: K, forms: [montagneux, montagnard]}
          - {tag: hill, fr: colline, src: K}
          - {tag: forest, fr: forêt, src: K, forms: [forestier, déforestation, reforestation]}
          - {tag: trees, fr: arbres, src: K, lemma: arbre}
          - {tag: bushes, fr: buissons, src: K, lemma: buisson}
          - {tag: grass, fr: herbe, src: K, forms: [herbacé, herbage, herbeux]}
          - {tag: flowers, fr: fleurs, src: K, lemma: fleur, forms: [fleuri, fleurir, fleurissement, fleuriste], exclude: ['à fleur de']}
          - {tag: blossoming, fr: floraison, src: K}
          - {tag: island, fr: île, src: K, forms: [îlot, presqu'île]}
      - name: Extension
        entries:
          - {tag: landscape, fr: paysage, src: E, forms: [paysager, paysagiste]}
          - {tag: climate, fr: climat, src: E, forms: [climatique, climatologie, climatologique, climatisation, climatisé]}
          - {tag: heat, fr: chaleur, src: E}
          - {tag: cold, fr: froid, src: E, pos: adj, forms: [froidure, refroidissement]}
          - {tag: dusk, fr: crépuscule, src: E, forms: [crépusculaire]}
          - {tag: relief, fr: relief, src: E}
          - {tag: valley, fr: vallée, src: E, forms: [vallon, vallonné, vallonnement]}
          - {tag: plain, fr: plaine, src: E}
          - {tag: plateau, fr: plateau, src: E}
          - {tag: cliff, fr: falaise, src: E}
          - {tag: gorge, fr: gorge, src: E}
          - {tag: rock, fr: rocher, src: E, forms: [roche, rocheux]}
          - {tag: cave, fr: grotte, src: E}
          - {tag: geology, fr: géologie, src: E, forms: [géologique, géologue]}
          - {tag: coast, fr: côte, src: E, forms: [côtier], exclude: ['côte à côte']}
          - {tag: beach, fr: plage, src: E}
          - {tag: marsh, fr: marais, src: E, pos: inv}
          - {tag: spring (water), fr: source, src: E, exclude: ['selon (?:les |des |certaines |d''autres )?sources', 'de source sûre', 'sources? (?:historiques?|écrites?|anciennes?|documentaires?|bibliographiques?)']}
          - {tag: meadow, fr: prairie, src: E}
          - {tag: field, fr: champ, src: E, forms: [champêtre], exclude: ['champ d''action', 'champ d''application', 'champs? de vision', 'champs? électromagnétiques?']}
          - {tag: orchard, fr: verger, src: E}
          - {tag: vineyard, fr: vignoble, src: E, forms: [vigne, vigneron]}
          - {tag: fauna, fr: faune, src: E, forms: [faunistique]}
          - {tag: flora, fr: flore, src: E, forms: [floristique]}
          - {tag: biodiversity, fr: biodiversité, src: E}
          - {tag: nature reserve, fr: réserve naturelle, src: E, pos: expr}

