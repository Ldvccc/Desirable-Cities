                       'cultures? (?:de |du |des |de la |de l'')(?:vigne|blé|maïs|céréales|tabac|houblon|lin|chanvre|betteraves?|oliviers?|légumes|fruits|pommes de terre)',
                       '(?:grandes|petites) cultures', 'terres? de cultures?', 'mises? en culture', 'en culture']}
          - {tag: social crowd, fr: foule, src: G}
          - {tag: atmosphere, fr: ambiance, src: G}
          - {tag: sound, fr: son, src: G, require: det, forms: [sonore, sonorité]}
          - {tag: smell, fr: odeur, src: G}
      - name: Social crowd density (Koinos 2.1)
        entries:
          - {tag: nobody, fr: désert, src: K, pos: adj, forms: [déserté, désertique, désertification]}
          - {tag: few people, fr: peu fréquenté, src: K, pos: expr}
          - {tag: people, fr: passants, src: K, lemma: passant, require: det}
          - {tag: many people, fr: affluence, src: K}
          - {tag: crowded, fr: foule, src: K}
      - name: Atmosphere (Koinos 2.2)
        entries:
          - {tag: relax, fr: détente, src: K}
          - {tag: peaceful, fr: paisible, src: K, forms: [paisiblement]}
          - {tag: mistic (mystic), fr: mystique, src: K, forms: [mysticisme]}
          - {tag: sacred, fr: sacré, src: K, pos: adj}
          - {tag: cultural, fr: culturel, src: K, pos: adj}
          - {tag: educational, fr: éducatif, src: K, pos: adj, forms: [éducation]}
          - {tag: artistic, fr: artistique, src: K, forms: [artiste, art], exclude: ['ouvrages? d''art']}
          - {tag: festive, fr: festif, src: K, pos: adj, forms: [festivité]}
          - {tag: sportive, fr: sportif, src: K, pos: adj, forms: [sport]}
          - {tag: urban, fr: urbain, src: K, pos: adj, forms: [urbanisé, urbanisme, périurbain, urbanité]}
          - {tag: safe, fr: sûr, src: K, pos: adj, forms: [sûreté], exclude: ['bien sûr', 'à coup sûr', 'sûr(?:e|s|es)? de']}
          - {tag: clean, fr: propre, src: K, pos: adj, forms: [propreté],
             exclude: ['fiscalité propre', 'noms? propres?', 'sens propre', 'fonds propres', 'en propre', 'propres? à',
                       'amour-propre', '(?:son|sa|ses|leur|leurs|notre|nos|mon|ma|mes|votre|vos) propres?']}
      - name: Sounds (Koinos 2.3)
        entries:
          - {tag: quiet, fr: calme, src: K, forms: [calmement]}
          - {tag: people, fr: brouhaha, src: K}
          - {tag: cars, fr: voitures, src: K, lemma: voiture, when: {context: sound, else: B}}
          - {tag: trains, fr: trains, src: K, lemma: train, when: {context: sound, else: B},
             exclude: ['en train de', 'trains? de vie', 'trains? de (?:mesures|réformes)']}
          - {tag: planes, fr: avions, src: K, lemma: avion}
          - {tag: bicycles, fr: vélos, src: K, lemma: vélo, when: {context: sound, else: B}}
          - {tag: music, fr: musique, src: K, forms: [musical, musicien]}
          - {tag: busy, fr: bruyant, src: K, pos: adj, forms: [bruit]}
      - name: Smells (Koinos 2.4)
        entries:
          - {tag: restaurants, fr: restaurants, src: K, lemma: restaurant, when: {context: smell, else: B}}
          - {tag: bakeries, fr: boulangeries, src: K, lemma: boulangerie, forms: [boulanger]}
          - {tag: bars, fr: bars, src: K, lemma: bar, when: {context: smell, else: B}, exclude: ['\d+(?:,\d+)? bars?']}
          - {tag: food markets, fr: marchés, src: K, lemma: marché, when: {context: smell, else: B},
