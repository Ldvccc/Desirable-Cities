        ref: "1.1, p. 534"
        status: thesis
        terms:
          - {en: winter, fr: [hiver, hivernal]}
          - {en: spring, fr: [printemps, printanier]}
          - {en: summer, fr: [été, estival]}
          - {en: autumn, fr: [automne, automnal]}
