responses:

  emotion:
    label: Emotions triggered
    definition: "Immediate affective states: how a setting's look, sound and social climate resonate with individuals (Koinos 4, p. 536)."
    subcategories:
      - id: koinos_emotions
        source: koinos_tags
        ref: "4, p. 536 (7 emotions, all positive)"
        status: thesis
        terms:
          - {en: calm, fr: [calme, apaisant, sérénité, serein, tranquillité]}
          - {en: comfort, fr: [confort, confortable, agréable, bien-être]}
          - {en: happy, fr: [heureux, joie, bonheur, plaisir, gaieté]}
          - {en: excited, fr: [enthousiasme, excitation, effervescence, vibrant]}
          - {en: inspired, fr: [inspirant, inspiration, émerveillement, fasciné]}
          - {en: surprised, fr: [surprenant, surprise, étonnant, insolite]}
          - {en: nostalgia, fr: [nostalgie, nostalgique]}
      - id: negative_emotions
        source: thesis_text
        ref: "ch. 14 conclusion pp. 251-252 (stress, disconnection); Ellard in §19.2.4, pp. 298-299 (bored and unhappy)"
        status: extension
        note: "The Koinos list is only positive (the thesis notes an over-positivity bias of the cards, p. 409). Wikipedia sentences can report negative feelings."
        terms:
          - {en: boredom, fr: [ennui, ennuyeux, monotone]}
          - {en: stress, fr: [stress, stressant, oppressant, anxiété]}
          - {en: fear, fr: [peur, insécurité, inquiétude]}
          - {en: sadness, fr: [tristesse, triste, désolation, mélancolie]}
          - {en: disconnection, fr: [isolement, abandon, délaissé]}

  action:
    label: Actions triggered
    definition: "Behaviours a place provokes or enables, such as strolling, exercising or socialising (Koinos 5, p. 537; ch. 15.6, p. 265)."
    subcategories:
      - id: koinos_actions
        source: koinos_tags
        ref: "5, p. 537 (20 actions); ch. 15.6 p. 265 lists the same minus jogging"
        status: thesis
        terms:
          - {en: working out, fr: [faire du sport, s'entraîner, fitness, musculation]}
          - {en: jogging, fr: [jogging, footing]}
          - {en: running, fr: [courir, course à pied]}
          - {en: sitting, fr: [s'asseoir, banc, assis]}
          - {en: laying down, fr: [s'allonger, bronzer, se prélasser]}
          - {en: taking pictures, fr: [photographier, photo, photographie]}
          - {en: taking selfies, fr: [selfie]}
          - {en: eating, fr: [manger, déguster, pique-nique, pique-niquer]}
          - {en: drinking, fr: [boire, prendre un verre, apéritif]}
          - {en: shopping, fr: [faire les courses, faire du shopping, lèche-vitrine]}
          - {en: biking, fr: [faire du vélo, pédaler, cyclisme, cyclotourisme]}
          - {en: skating, fr: [patiner, patinage, roller]}
          - {en: driving, fr: [conduire, rouler]}
          - {en: walking, fr: [marcher, se promener, flâner, balade, randonnée, randonner]}
          - {en: working, fr: [travailler, travail, emploi]}
          - {en: thinking, fr: [méditer, se recueillir, contempler]}
          - {en: calling, fr: [téléphoner]}
          - {en: smoking, fr: [fumer]}
          - {en: playing, fr: [jouer, jeu, aire de jeux]}
          - {en: dancing, fr: [danser, danse, bal, guinguette]}
      - id: leisure_extension
        source: subject
        ref: "subject: social behaviours and urban performances"
        status: extension
        note: "Activities frequent in Wikipedia tourism and leisure sections, absent from the Koinos list."
        terms:
          - {en: swimming, fr: [se baigner, baignade, nager]}
          - {en: fishing, fr: [pêcher, pêche]}
          - {en: visiting, fr: [visiter, visite, découvrir]}
          - {en: gathering, fr: [se retrouver, se rassembler, se réunir]}
          - {en: water sports, fr: [voile, kayak, canoë, surf, aviron]}
          - {en: skiing, fr: [ski, skier]}

  reflection:
    label: Reflections triggered (ideas, thoughts)
    definition: "Interpretations and meanings a place triggers: reflections, proposals, imaginative visions (Koinos 6 'Ideas', p. 537: free text only). In the paradigm, reflections are imaginary-based arguments leading to expectations of meanings (Table 01, p. 14)."
    open_issue: "No keyword list exists in the thesis: the Terms-naire Tray omits ideas (p. 380) and Koinos uses free text (p. 537). The markers below are a proposal to be tested against the gold set and an LLM classifier."
    subcategories:
      - id: meaning_attribution
        source: proposal
        ref: "derived from P91 answers (pp. 457-460): 'represents', 'feeds the imagination', 'reminds me'"
        status: proposal
        terms:
          - {en: symbol of, fr: [symbole de, symbolise, symbolique, incarne, emblème de]}
          - {en: represents, fr: [représente, témoigne de, illustre, reflète]}
          - {en: evokes, fr: [évoque, rappelle, fait penser à]}
          - {en: imagination, fr: [imaginaire, imagination, mythe, légende]}
      - id: evaluation_reputation
        source: proposal
        ref: "evaluative statements about a place"
        status: proposal
        terms:
          - {en: considered as, fr: [considéré comme, qualifié de, réputé, renommé, célèbre pour, connu pour]}
          - {en: nickname, fr: [surnommé, surnom]}
          - {en: judgement, fr: [remarquable, exceptionnel, unique, typique, caractéristique]}
      - id: cognition_proposals
        source: proposal
        ref: "reflections, suggestions or visions (Koinos 6, p. 537)"
        status: proposal
        terms:
          - {en: cognitive verbs, fr: [penser, estimer, juger, débattre, controverse, critique]}
          - {en: projects and visions, fr: [projet, ambition, vision, aspiration, souhaite]}

facets:

  public_space_types:
    label: The nine open-air public-space types (ch. 15.4, p. 255)
    source: ch15
    note: "Controlled vocabulary of the 'public_space_types' field. 'koinos' maps the 18 Koinos types (p. 535) onto the nine types; the mapping is our proposal."
    types:
      - {id: sightseeing_site, en: sightseeing sites, ref: "§15.4.1, p. 256", koinos: [landmark], fr: [monument, site touristique, point de vue, belvédère, panorama, lieu emblématique]}
      - {id: public_square, en: public squares, ref: "§15.4.2, p. 256", koinos: [square/plaza], fr: [place, esplanade, parvis]}
      - {id: major_boulevard, en: major boulevards, ref: "§15.4.3, p. 257", koinos: [avenue, pedestrian boulevard], fr: [boulevard, avenue, cours, grande artère]}
      - {id: small_street, en: small streets, ref: "§15.4.4, p. 257", koinos: [street, lane], fr: [rue, ruelle, venelle, passage, traboule, impasse]}
      - {id: commercial_open_air, en: commercial open-air spaces, ref: "§15.4.5, p. 258", koinos: [terrace], fr: [terrasse, rue commerçante, rue piétonne, marché]}
      - {id: popup_street_market, en: pop-up street markets, ref: "§15.4.6, p. 259", koinos: [street market, entertainment-fair], fr: [marché de noël, brocante, vide-grenier, braderie, marché nocturne, fête foraine]}
