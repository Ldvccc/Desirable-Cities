# Desirable Cities lexicon, version 0.1.0 (2026-11-01)
#
# Keywords that justify assigning a sentence to a category of the Desirable
# Cities framework (Villar 2025). Used by the keyword classifier (algorithm A)
# and as definitions in the LLM prompts (algorithm B).
#
# Page numbers = PRINTED page numbers of the thesis (PDF page = printed + 19).
#
# status:
#   thesis    = list taken from the thesis (English term verbatim); the French
#               terms are our translation and must be validated.
#   extension = proposed by us to cover Wikipedia content the thesis lists do
#               not cover; to be validated with John Villar.
#   proposal  = experimental, no list exists in the thesis (reflections).
#
# Matching rules (v0): terms are lower-case lemmas; multi-word terms match as
# phrases; the classifier lemmatises the sentence before matching.

version: 0.1.0
date: "2026-11-01"
sources:
  terms_naire_tray: "Terms-naire Tray, §22.5.7, p. 380 (Image 156, p. 381): natural, cultural, built, emotions, actions; ideas deliberately omitted"
  koinos_tags: "Koinos full tagging system, §31.2.3.7, pp. 533-537 (same structure as the Terms-naire Tray)"
  ch15: "Constructural environment framework, ch. 15, pp. 253-265"
  emotionnaire: "Emotion-naire Cards, §22.5.5, p. 367 (four card categories)"
  subject: "EG01 subject proposal, section 1 (natural / cultural / constructural boxes)"
  thesis_text: "Thesis body text (page given in ref)"
  proposal: "Our proposal, no list in the thesis"

environments:

