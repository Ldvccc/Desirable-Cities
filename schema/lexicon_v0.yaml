          - {en: dry, fr: [sec, sécheresse, aride]}
      - id: weather
        source: koinos_tags
        ref: "1.2, p. 534"
        status: thesis
        terms:
          - {en: sunny, fr: [ensoleillé, ensoleillement, soleil]}
          - {en: cloudy, fr: [nuageux, nébulosité]}
          - {en: windy, fr: [venteux, vent, mistral, tramontane]}
          - {en: rainy, fr: [pluie, pluvieux, précipitation]}
          - {en: stormy, fr: [orage, orageux, tempête]}
